{% extends 'base.html' %}

{% block sitetitle %}Dashboard{% endblock %}

{% block content %}
<h1 class="title">Welcome, {{ username }}!</h1>
<p style="text-align:center; color:gray;">What would you like to do today?</p>

<ul class="task_list" style="margin-top:2rem;">
    <li class="task_item">
        <span>✅ To-Do List</span>
        <a href="{{ url_for('todo') }}" class="btn_complete">Go</a>
    </li>
    <li class="task_item">
        <span>📝 Blog</span>
        <a href="{{ url_for('blog') }}" class="btn_complete">Go</a>
    </li>
    <li class="task_item">
        <span>🖼️ Notes</span>
        <a href="{{ url_for('notes') }}" class="btn_complete">Go</a>
    </li>
    <li class="task_item">
        <span>👤 Profile</span>
        <a href="{{ url_for('profile') }}" class="btn_complete">Go</a>
    </li>
</ul>
{% endblock %}
